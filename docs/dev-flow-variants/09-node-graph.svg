<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="/dev node graph — sequential dataflow with 4-reviewer fanout, clean bezier edges">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect width="1400" height="720" rx="20" fill="url(#bg)"/>
  <rect width="1400" height="720" rx="20" fill="url(#grid)"/>

  <!-- Caption -->
  <text x="700" y="36" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="3">/DEV — SCHEMATIC · 15 NODES WIRED TO 4 REVIEWER FANOUT</text>

  <!-- Phase labels -->
  <text x="240" y="82" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="2">PLANNING · 6</text>
  <text x="480" y="82" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#fcd34d" letter-spacing="2">EXECUTION · 5</text>
  <text x="700" y="82" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" letter-spacing="2">REVIEW ·12</text>
  <text x="870" y="82" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="2">×4 PARALLEL</text>
  <text x="1165" y="82" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" letter-spacing="2">FINALIZE · 3</text>

  <!-- ═══════ EDGES (drawn first so nodes render on top) ═══════ -->
  <g fill="none" opacity="0.75">
    <!-- /dev → 01 (violet) -->
    <path d="M 130 360 Q 170 270 200 180" stroke="#a78bfa" stroke-width="1.8"/>

    <!-- Planning internal zigzag: 01→02→03→04→05→06 -->
    <g stroke="#818cf8" stroke-width="1.6">
      <path d="M 200 180 Q 240 200 280 260"/>
      <path d="M 280 260 Q 240 300 200 340"/>
      <path d="M 200 340 Q 240 380 280 420"/>
      <path d="M 280 420 Q 240 460 200 500"/>
      <path d="M 200 500 Q 240 540 280 580"/>
    </g>

    <!-- Planning → Execution bridge (06 → 07) -->
    <path d="M 280 580 Q 400 480 440 180" stroke="#c4b5fd" stroke-width="1.8" stroke-dasharray="5,3"/>

    <!-- Execution internal zigzag: 07→08→09→10→11 -->
    <g stroke="#fbbf24" stroke-width="1.6">
      <path d="M 440 180 Q 480 200 520 260"/>
      <path d="M 520 260 Q 480 300 440 340"/>
      <path d="M 440 340 Q 480 380 520 420"/>
      <path d="M 520 420 Q 480 460 440 500"/>
    </g>

    <!-- Execution → Review bridge (11 → 12) -->
    <path d="M 440 500 Q 570 460 700 360" stroke="#fde68a" stroke-width="1.8" stroke-dasharray="5,3"/>

    <!-- Review → 4 reviewers (fanout) — bright emerald -->
    <g stroke="#34d399" stroke-width="2">
      <path d="M 736 360 Q 810 280 860 240"/>
      <path d="M 736 360 Q 810 340 860 320"/>
      <path d="M 736 360 Q 810 380 860 400"/>
      <path d="M 736 360 Q 810 440 860 480"/>
    </g>

    <!-- 4 reviewers → 13 Critic (merge back) -->
    <g stroke="#6ee7b7" stroke-width="1.6">
      <path d="M 900 240 Q 980 300 1040 360"/>
      <path d="M 900 320 Q 980 340 1040 360"/>
      <path d="M 900 400 Q 980 380 1040 360"/>
      <path d="M 900 480 Q 980 420 1040 360"/>
    </g>

    <!-- 13 → 14 → 15 (sequential) -->
    <g stroke="#6ee7b7" stroke-width="1.6">
      <path d="M 1080 360 L 1140 360"/>
      <path d="M 1190 360 L 1250 360"/>
    </g>

    <!-- 15 → DONE -->
    <path d="M 1300 360 Q 1345 360 1370 360" stroke="#c4b5fd" stroke-width="2"/>
  </g>

  <!-- ═══════ /dev CORE ═══════ -->
  <circle cx="90" cy="360" r="40" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2.5" filter="url(#glow)"/>
  <text x="90" y="356" text-anchor="middle" font-family="'SF Mono',monospace" font-size="13" font-weight="700" fill="#ddd6fe">/dev</text>
  <text x="90" y="374" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#a78bfa">&lt;task&gt;</text>

  <!-- ═══════ PLANNING CLUSTER (6 nodes zigzag) ═══════ -->
  <g font-family="'SF Mono',monospace" font-size="11" font-weight="700">
    <circle cx="200" cy="180" r="22" fill="#312e81" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <text x="200" y="184" text-anchor="middle" fill="#e0e7ff">01</text>
    <text x="160" y="160" text-anchor="end" font-family="-apple-system,sans-serif" font-size="10" fill="#a5b4fc" font-weight="600">Understand</text>

    <circle cx="280" cy="260" r="22" fill="#312e81" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <text x="280" y="264" text-anchor="middle" fill="#e0e7ff">02</text>
    <text x="320" y="260" font-family="-apple-system,sans-serif" font-size="10" fill="#a5b4fc" font-weight="600">Architect</text>

    <circle cx="200" cy="340" r="22" fill="#312e81" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <text x="200" y="344" text-anchor="middle" fill="#e0e7ff">03</text>
    <text x="160" y="342" text-anchor="end" font-family="-apple-system,sans-serif" font-size="10" fill="#a5b4fc" font-weight="600">Pseudocode</text>

    <circle cx="280" cy="420" r="22" fill="#312e81" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <text x="280" y="424" text-anchor="middle" fill="#e0e7ff">04</text>
    <text x="320" y="424" font-family="-apple-system,sans-serif" font-size="10" fill="#a5b4fc" font-weight="600">Plan</text>

    <circle cx="200" cy="500" r="22" fill="#312e81" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <text x="200" y="504" text-anchor="middle" fill="#e0e7ff">05</text>
    <text x="160" y="502" text-anchor="end" font-family="-apple-system,sans-serif" font-size="10" fill="#a5b4fc" font-weight="600">Contract</text>

    <circle cx="280" cy="580" r="22" fill="#312e81" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <text x="280" y="584" text-anchor="middle" fill="#e0e7ff">06</text>
    <text x="320" y="584" font-family="-apple-system,sans-serif" font-size="10" fill="#a5b4fc" font-weight="600">Validate</text>
  </g>

  <!-- ═══════ EXECUTION CLUSTER (5 nodes zigzag) ═══════ -->
  <g font-family="'SF Mono',monospace" font-size="11" font-weight="700">
    <circle cx="440" cy="180" r="22" fill="#78350f" stroke="#d97706" stroke-width="2" filter="url(#glow)"/>
    <text x="440" y="184" text-anchor="middle" fill="#fde68a">07</text>
    <text x="400" y="160" text-anchor="end" font-family="-apple-system,sans-serif" font-size="10" fill="#fbbf24" font-weight="600">Implement</text>

    <circle cx="520" cy="260" r="22" fill="#78350f" stroke="#d97706" stroke-width="2" filter="url(#glow)"/>
    <text x="520" y="264" text-anchor="middle" fill="#fde68a">08</text>
    <text x="560" y="260" font-family="-apple-system,sans-serif" font-size="10" fill="#fbbf24" font-weight="600">Evaluate</text>

    <circle cx="440" cy="340" r="22" fill="#78350f" stroke="#d97706" stroke-width="2" filter="url(#glow)"/>
    <text x="440" y="344" text-anchor="middle" fill="#fde68a">09</text>
    <text x="400" y="342" text-anchor="end" font-family="-apple-system,sans-serif" font-size="10" fill="#fbbf24" font-weight="600">Verify</text>

    <circle cx="520" cy="420" r="22" fill="#78350f" stroke="#d97706" stroke-width="2" filter="url(#glow)"/>
    <text x="520" y="424" text-anchor="middle" fill="#fde68a">10</text>
    <text x="560" y="424" font-family="-apple-system,sans-serif" font-size="10" fill="#fbbf24" font-weight="600">Test</text>

    <circle cx="440" cy="500" r="22" fill="#78350f" stroke="#d97706" stroke-width="2" filter="url(#glow)"/>
    <text x="440" y="504" text-anchor="middle" fill="#fde68a">11</text>
    <text x="400" y="502" text-anchor="end" font-family="-apple-system,sans-serif" font-size="10" fill="#fbbf24" font-weight="600">Goals</text>
  </g>

  <!-- ═══════ REVIEW NODE (big, central hub) ═══════ -->
  <circle cx="700" cy="360" r="36" fill="#047857" stroke="#6ee7b7" stroke-width="3" filter="url(#glow)"/>
  <text x="700" y="358" text-anchor="middle" font-family="'SF Mono',monospace" font-size="13" font-weight="700" fill="#d1fae5">12</text>
  <text x="700" y="378" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#ecfdf5" font-weight="700">Review ×4</text>

  <!-- ═══════ 4 REVIEWER NODES ═══════ -->
  <g font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#d1fae5">
    <circle cx="880" cy="240" r="24" fill="#065f46" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="880" y="238" text-anchor="middle" font-size="10">CODE</text>
    <text x="880" y="250" text-anchor="middle" font-size="8" opacity="0.7">review</text>

    <circle cx="880" cy="320" r="24" fill="#065f46" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="880" y="317" text-anchor="middle" font-size="9">SECURITY</text>
    <text x="880" y="330" text-anchor="middle" font-size="8" opacity="0.7">scan</text>

    <circle cx="880" cy="400" r="24" fill="#065f46" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="880" y="398" text-anchor="middle" font-size="10">TESTS</text>
    <text x="880" y="410" text-anchor="middle" font-size="8" opacity="0.7">coverage</text>

    <circle cx="880" cy="480" r="24" fill="#065f46" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="880" y="478" text-anchor="middle" font-size="10">DOCS</text>
    <text x="880" y="490" text-anchor="middle" font-size="8" opacity="0.7">audit</text>
  </g>

  <!-- ═══════ 13 CRITIC · 14 DOCS · 15 REPORT (finalize chain) ═══════ -->
  <g font-family="'SF Mono',monospace" font-size="11" font-weight="700">
    <circle cx="1060" cy="360" r="22" fill="#064e3b" stroke="#059669" stroke-width="2" filter="url(#glow)"/>
    <text x="1060" y="364" text-anchor="middle" fill="#a7f3d0">13</text>
    <text x="1060" y="324" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#34d399" font-weight="600">Critic</text>

    <circle cx="1170" cy="360" r="22" fill="#064e3b" stroke="#059669" stroke-width="2" filter="url(#glow)"/>
    <text x="1170" y="364" text-anchor="middle" fill="#a7f3d0">14</text>
    <text x="1170" y="324" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#34d399" font-weight="600">Docs</text>

    <circle cx="1280" cy="360" r="22" fill="#064e3b" stroke="#059669" stroke-width="2" filter="url(#glow)"/>
    <text x="1280" y="364" text-anchor="middle" fill="#a7f3d0">15</text>
    <text x="1280" y="324" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#34d399" font-weight="600">Report</text>
  </g>

  <!-- ═══════ DONE TERMINAL ═══════ -->
  <circle cx="1370" cy="360" r="24" fill="#6d28d9" stroke="#c4b5fd" stroke-width="2" filter="url(#glow)"/>
  <text x="1370" y="358" text-anchor="middle" font-family="'SF Mono',monospace" font-size="9" font-weight="700" fill="#ede9fe">DONE</text>
  <text x="1370" y="370" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="7" fill="#c4b5fd">shipped</text>

  <!-- Footer -->
  <text x="700" y="680" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#64748b">complete · tested · documented — zero half-finished work</text>
</svg>
