<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="/dev radial clock — 15 phases orbit the core, compact layout">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
  </defs>
  <rect width="720" height="720" rx="20" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Caption -->
  <text x="360" y="32" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="3">/DEV — 15 PHASES IN ORBIT</text>

  <!-- Phase arcs (colored guide lines outside node ring) -->
  <path d="M 360 108 A 252 252 0 0 1 578 486" fill="none" stroke="#a5b4fc" stroke-width="5" opacity="0.6" stroke-linecap="round"/>
  <path d="M 508 564 A 252 252 0 0 1 142 486" fill="none" stroke="#fcd34d" stroke-width="5" opacity="0.6" stroke-linecap="round"/>
  <path d="M 109 386 A 252 252 0 0 1 257 130" fill="none" stroke="#6ee7b7" stroke-width="5" opacity="0.6" stroke-linecap="round"/>

  <!-- Phase titles near arcs -->
  <text x="605" y="310" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#4338ca" letter-spacing="1.5">PLANNING</text>
  <text x="605" y="326" font-family="'SF Mono',monospace" font-size="9" fill="#6366f1">6 steps</text>

  <text x="360" y="670" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#92400e" letter-spacing="1.5">EXECUTION</text>
  <text x="360" y="686" text-anchor="middle" font-family="'SF Mono',monospace" font-size="9" fill="#d97706">5 steps</text>

  <text x="60" y="310" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#047857" letter-spacing="1.5">QUALITY</text>
  <text x="60" y="326" font-family="'SF Mono',monospace" font-size="9" fill="#059669">4 steps</text>

  <!-- /dev core pill centered -->
  <rect x="255" y="332" width="210" height="56" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2" filter="url(#sh)"/>
  <text x="360" y="357" text-anchor="middle" font-family="'SF Mono',monospace" font-size="17" font-weight="700" fill="#6d28d9">/dev &lt;task&gt;</text>
  <text x="360" y="376" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9.5" fill="#7c3aed">15-phase orchestrator</text>

  <!-- Planning (steps 1-6) — indigo -->
  <g>
    <circle cx="360" cy="130" r="24" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="360" y="135" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">01</text>
    <text x="360" y="90" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#4338ca">Understand</text>

    <circle cx="454" cy="150" r="24" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="454" y="155" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">02</text>
    <text x="500" y="128" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#4338ca">Architect</text>

    <circle cx="531" cy="206" r="24" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="531" y="211" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">03</text>
    <text x="580" y="200" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#4338ca">Pseudocode</text>

    <circle cx="579" cy="289" r="24" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="579" y="294" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">04</text>
    <text x="622" y="285" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#4338ca">Plan</text>

    <circle cx="589" cy="384" r="24" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="589" y="389" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">05</text>
    <text x="632" y="380" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#4338ca">Contract</text>

    <circle cx="559" cy="475" r="24" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="559" y="480" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">06</text>
    <text x="602" y="476" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#4338ca">Validate</text>
  </g>

  <!-- Execution (steps 7-11) — amber -->
  <g>
    <circle cx="495" cy="546" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#sh)"/>
    <text x="495" y="551" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#92400e">07</text>
    <text x="530" y="582" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#92400e">Implement</text>

    <circle cx="408" cy="585" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#sh)"/>
    <text x="408" y="590" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#92400e">08</text>
    <text x="422" y="630" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#92400e">Evaluate</text>

    <circle cx="312" cy="585" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#sh)"/>
    <text x="312" y="590" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#92400e">09</text>
    <text x="258" y="630" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#92400e">Verify</text>

    <circle cx="225" cy="546" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#sh)"/>
    <text x="225" y="551" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#92400e">10</text>
    <text x="160" y="582" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#92400e">Test</text>

    <circle cx="161" cy="475" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#sh)"/>
    <text x="161" y="480" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#92400e">11</text>
    <text x="100" y="476" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#92400e">Goals</text>
  </g>

  <!-- Quality (steps 12-15) — emerald, Review highlighted -->
  <g>
    <!-- Review node — bigger, filled -->
    <circle cx="131" cy="384" r="30" fill="#059669" stroke="#047857" stroke-width="2.5" filter="url(#sh)"/>
    <text x="131" y="390" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">12</text>
    <text x="131" y="356" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#047857">Review ×4</text>

    <circle cx="141" cy="289" r="24" fill="#d1fae5" stroke="#059669" stroke-width="2.2" filter="url(#sh)"/>
    <text x="141" y="294" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#047857">13</text>
    <text x="92" y="285" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#047857">Critic</text>

    <circle cx="189" cy="206" r="24" fill="#d1fae5" stroke="#059669" stroke-width="2.2" filter="url(#sh)"/>
    <text x="189" y="211" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#047857">14</text>
    <text x="140" y="200" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#047857">Docs</text>

    <circle cx="266" cy="150" r="24" fill="#d1fae5" stroke="#059669" stroke-width="2.2" filter="url(#sh)"/>
    <text x="266" y="155" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#047857">15</text>
    <text x="220" y="128" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#047857">Report</text>
  </g>

  <!-- 4 reviewer satellites around Review node (compact arc to the left) -->
  <g>
    <line x1="131" y1="384" x2="68" y2="326" stroke="#10b981" stroke-width="1.2" opacity="0.55" stroke-dasharray="3,2"/>
    <circle cx="60" cy="322" r="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="60" y="326" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" font-weight="700" fill="#065f46">Code</text>

    <line x1="131" y1="384" x2="47" y2="384" stroke="#10b981" stroke-width="1.2" opacity="0.55" stroke-dasharray="3,2"/>
    <circle cx="36" cy="384" r="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="36" y="382" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="8" font-weight="700" fill="#065f46">Sec</text>
    <text x="36" y="391" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="7" fill="#065f46">urity</text>

    <line x1="131" y1="384" x2="68" y2="442" stroke="#10b981" stroke-width="1.2" opacity="0.55" stroke-dasharray="3,2"/>
    <circle cx="60" cy="446" r="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="60" y="450" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" font-weight="700" fill="#065f46">Tests</text>

    <line x1="131" y1="384" x2="100" y2="484" stroke="#10b981" stroke-width="1.2" opacity="0.55" stroke-dasharray="3,2"/>
    <circle cx="100" cy="494" r="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="100" y="498" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" font-weight="700" fill="#065f46">Docs</text>
  </g>

  <!-- Footer -->
  <text x="360" y="704" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#94a3b8">complete · tested · documented — zero half-finished work</text>
</svg>
