<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="/dev swim lanes — 3 phase lanes with review zoom-in">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="720" rx="20" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Caption -->
  <text x="700" y="36" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="3">/DEV — 3 SWIM LANES · 15 PHASES · REVIEW ZOOMED IN</text>

  <!-- /dev pill top-left -->
  <rect x="50" y="60" width="220" height="56" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.8" filter="url(#sh)"/>
  <text x="160" y="84" text-anchor="middle" font-family="'SF Mono',monospace" font-size="17" font-weight="700" fill="#6d28d9">/dev &lt;task&gt;</text>
  <text x="160" y="102" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#7c3aed">15-phase orchestrator</text>

  <!-- Summary badge top-right -->
  <rect x="1150" y="60" width="200" height="56" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1250" y="82" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#334155" letter-spacing="1">OUTPUT</text>
  <text x="1250" y="102" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#64748b">tested · documented code</text>

  <!-- LANE 1 — Planning -->
  <rect x="50" y="150" width="870" height="110" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="80" y="180" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#4338ca">PLANNING</text>
  <text x="80" y="196" font-family="'SF Mono',monospace" font-size="10" fill="#6366f1">6 steps · understand → contract</text>

  <g font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#312e81">
    <rect x="260" y="195" width="100" height="40" rx="20" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#sh)"/>
    <text x="274" y="220" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#6366f1">01</text>
    <text x="294" y="220">Understand</text>

    <rect x="370" y="195" width="92" height="40" rx="20" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#sh)"/>
    <text x="384" y="220" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#6366f1">02</text>
    <text x="404" y="220">Architect</text>

    <rect x="472" y="195" width="100" height="40" rx="20" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#sh)"/>
    <text x="486" y="220" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#6366f1">03</text>
    <text x="506" y="220">Pseudocode</text>

    <rect x="582" y="195" width="72" height="40" rx="20" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#sh)"/>
    <text x="596" y="220" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#6366f1">04</text>
    <text x="616" y="220">Plan</text>

    <rect x="664" y="195" width="92" height="40" rx="20" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#sh)"/>
    <text x="678" y="220" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#6366f1">05</text>
    <text x="698" y="220">Contract</text>

    <rect x="766" y="195" width="92" height="40" rx="20" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#sh)"/>
    <text x="780" y="220" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#6366f1">06</text>
    <text x="800" y="220">Validate</text>
  </g>

  <!-- Curve from end of Planning to start of Execution -->
  <path d="M 860 235 Q 880 260 880 290 Q 880 310 260 335 L 260 355" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="4,3"/>

  <!-- LANE 2 — Execution -->
  <rect x="50" y="310" width="870" height="110" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="80" y="340" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#92400e">EXECUTION</text>
  <text x="80" y="356" font-family="'SF Mono',monospace" font-size="10" fill="#d97706">5 steps · implement → verify goals</text>

  <g font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#78350f">
    <rect x="260" y="355" width="96" height="40" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#sh)"/>
    <text x="274" y="380" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#d97706">07</text>
    <text x="294" y="380">Implement</text>

    <rect x="366" y="355" width="88" height="40" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#sh)"/>
    <text x="380" y="380" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#d97706">08</text>
    <text x="400" y="380">Evaluate</text>

    <rect x="464" y="355" width="76" height="40" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#sh)"/>
    <text x="478" y="380" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#d97706">09</text>
    <text x="498" y="380">Verify</text>

    <rect x="550" y="355" width="68" height="40" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#sh)"/>
    <text x="564" y="380" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#d97706">10</text>
    <text x="584" y="380">Test</text>

    <rect x="628" y="355" width="72" height="40" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#sh)"/>
    <text x="642" y="380" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#d97706">11</text>
    <text x="662" y="380">Goals</text>
  </g>

  <!-- Curve from Execution to Quality -->
  <path d="M 702 395 Q 730 420 730 450 Q 730 470 260 495 L 260 515" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="4,3"/>

  <!-- LANE 3 — Quality -->
  <rect x="50" y="470" width="870" height="110" rx="14" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="80" y="500" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#047857">QUALITY</text>
  <text x="80" y="516" font-family="'SF Mono',monospace" font-size="10" fill="#059669">4 steps · review → report</text>

  <g font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#064e3b">
    <!-- Review pill — highlighted -->
    <rect x="260" y="515" width="110" height="40" rx="20" fill="#059669" stroke="#047857" stroke-width="2" filter="url(#sh)"/>
    <text x="274" y="540" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#ffffff">12</text>
    <text x="294" y="540" fill="#ffffff" font-weight="700">Review ×4</text>

    <rect x="380" y="515" width="68" height="40" rx="20" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
    <text x="394" y="540" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#059669">13</text>
    <text x="414" y="540">Critic</text>

    <rect x="458" y="515" width="60" height="40" rx="20" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
    <text x="472" y="540" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#059669">14</text>
    <text x="492" y="540">Docs</text>

    <rect x="528" y="515" width="72" height="40" rx="20" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
    <text x="542" y="540" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#059669">15</text>
    <text x="562" y="540">Report</text>
  </g>

  <!-- ZOOM CALLOUT: Review ×4 detail — right side big panel -->
  <!-- Dashed indicator line from Review pill to zoom panel -->
  <path d="M 370 530 L 1000 260" stroke="#059669" stroke-width="1.2" fill="none" stroke-dasharray="4,3" opacity="0.55"/>
  <path d="M 370 540 L 1000 615" stroke="#059669" stroke-width="1.2" fill="none" stroke-dasharray="4,3" opacity="0.55"/>

  <!-- Zoom panel -->
  <rect x="1000" y="240" width="350" height="400" rx="16" fill="#ffffff" stroke="#059669" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="1000" y="240" width="350" height="50" rx="16" fill="#059669"/>
  <rect x="1000" y="274" width="350" height="16" fill="#059669"/>
  <text x="1175" y="272" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#ffffff">REVIEW ×4 · zoomed</text>
  <text x="1175" y="310" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10.5" fill="#475569" font-style="italic">4 parallel reviewers · double-verified findings</text>

  <!-- 4 reviewer cards -->
  <g font-family="-apple-system,sans-serif">
    <rect x="1020" y="330" width="310" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="1040" y="356" font-size="13" font-weight="700" fill="#065f46">01 · Code review</text>
    <text x="1040" y="378" font-size="10" fill="#047857">language reviewer — layers, DI, error handling</text>

    <rect x="1020" y="402" width="310" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="1040" y="428" font-size="13" font-weight="700" fill="#065f46">02 · Security scan</text>
    <text x="1040" y="450" font-size="10" fill="#047857">OWASP + secrets + auth + injection checks</text>

    <rect x="1020" y="474" width="310" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="1040" y="500" font-size="13" font-weight="700" fill="#065f46">03 · Test coverage</text>
    <text x="1040" y="522" font-size="10" fill="#047857">missing edge cases · failing path audit</text>

    <rect x="1020" y="546" width="310" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="1040" y="572" font-size="13" font-weight="700" fill="#065f46">04 · Docs audit</text>
    <text x="1040" y="594" font-size="10" fill="#047857">CLAUDE.md · architecture · OpenAPI sync</text>
  </g>

  <!-- Final arrow from Lane 3 to OUTPUT (top right pill) -->
  <path d="M 610 515 Q 900 480 1150 110" stroke="#6d28d9" stroke-width="2" fill="none" stroke-dasharray="0"/>
  <circle cx="1150" cy="110" r="4" fill="#6d28d9"/>

  <!-- Footer -->
  <text x="700" y="692" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#94a3b8">complete · tested · documented — zero half-finished work</text>
</svg>
