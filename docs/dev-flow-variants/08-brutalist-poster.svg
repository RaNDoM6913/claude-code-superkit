<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-label="/dev brutalist poster — bold editorial 15-phase listing">
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.8" fill="#0a0a0a" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Cream background with dots -->
  <rect width="1000" height="680" fill="#fdf6e3"/>
  <rect width="1000" height="680" fill="url(#dots)"/>

  <!-- Thick black frame -->
  <rect x="6" y="6" width="988" height="668" fill="none" stroke="#0a0a0a" stroke-width="4"/>

  <!-- TOP BAR: breadcrumb -->
  <rect x="6" y="6" width="988" height="44" fill="#0a0a0a"/>
  <text x="28" y="35" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#fdf6e3" letter-spacing="3">/DEV &lt;TASK&gt; ——— 15-PHASE ORCHESTRATOR ——— OPUS 4.6</text>
  <text x="972" y="35" text-anchor="end" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#fde047" letter-spacing="2">Nº.01</text>

  <!-- MASSIVE HEADLINE -->
  <text x="40" y="150" font-family="Georgia,serif" font-size="72" font-weight="900" fill="#0a0a0a" letter-spacing="-2">ORCHESTRATE</text>
  <text x="40" y="222" font-family="Georgia,serif" font-size="72" font-weight="900" fill="#0a0a0a" letter-spacing="-2">EVERY. PHASE.</text>

  <!-- Subtitle line -->
  <line x1="40" y1="246" x2="960" y2="246" stroke="#0a0a0a" stroke-width="2"/>
  <text x="40" y="270" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#0a0a0a" letter-spacing="2">SIX → FIVE → FOUR · NO HALF-FINISHED WORK · DOCUMENTATION ENFORCED</text>

  <!-- 3 PHASE COLUMNS -->
  <!-- Column 1: PLANNING -->
  <rect x="40" y="300" width="290" height="32" fill="#0a0a0a"/>
  <text x="52" y="322" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#fdf6e3" letter-spacing="3">01 — PLANNING · 6</text>

  <g font-family="Georgia,serif" font-size="17" fill="#0a0a0a">
    <text x="52" y="366"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">01</tspan><tspan dx="12" font-weight="700">Understand</tspan></text>
    <text x="52" y="396"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">02</tspan><tspan dx="12" font-weight="700">Architect</tspan></text>
    <text x="52" y="426"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">03</tspan><tspan dx="12" font-weight="700">Pseudocode</tspan></text>
    <text x="52" y="456"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">04</tspan><tspan dx="12" font-weight="700">Plan</tspan></text>
    <text x="52" y="486"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">05</tspan><tspan dx="12" font-weight="700">Contract</tspan></text>
    <text x="52" y="516"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">06</tspan><tspan dx="12" font-weight="700">Validate</tspan></text>
  </g>

  <!-- Column 2: EXECUTION -->
  <rect x="355" y="300" width="290" height="32" fill="#0a0a0a"/>
  <text x="367" y="322" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#fdf6e3" letter-spacing="3">02 — EXECUTION · 5</text>

  <g font-family="Georgia,serif" font-size="17" fill="#0a0a0a">
    <text x="367" y="366"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">07</tspan><tspan dx="12" font-weight="700">Implement</tspan></text>
    <text x="367" y="396"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">08</tspan><tspan dx="12" font-weight="700">Evaluate</tspan></text>
    <text x="367" y="426"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">09</tspan><tspan dx="12" font-weight="700">Verify</tspan></text>
    <text x="367" y="456"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">10</tspan><tspan dx="12" font-weight="700">Test</tspan></text>
    <text x="367" y="486"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">11</tspan><tspan dx="12" font-weight="700">Verify Goals</tspan></text>
  </g>

  <!-- Column 3: QUALITY -->
  <rect x="670" y="300" width="290" height="32" fill="#dc2626"/>
  <text x="682" y="322" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#fdf6e3" letter-spacing="3">03 — QUALITY · 4</text>

  <g font-family="Georgia,serif" font-size="17" fill="#0a0a0a">
    <text x="682" y="366"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#dc2626">12</tspan><tspan dx="12" font-weight="900" fill="#dc2626">Review ×4 ▸</tspan></text>
    <text x="682" y="396"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">13</tspan><tspan dx="12" font-weight="700">Critic</tspan></text>
    <text x="682" y="426"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">14</tspan><tspan dx="12" font-weight="700">Docs</tspan></text>
    <text x="682" y="456"><tspan font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#737373">15</tspan><tspan dx="12" font-weight="700">Report</tspan></text>
  </g>

  <!-- REVIEW ×4 EXPANSION BLOCK — big red band below column 3 -->
  <rect x="670" y="478" width="290" height="138" fill="#0a0a0a"/>
  <rect x="670" y="478" width="290" height="30" fill="#dc2626"/>
  <text x="682" y="499" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#fdf6e3" letter-spacing="3">▸ REVIEW ×4 — PARALLEL</text>

  <g font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#fdf6e3">
    <text x="682" y="528">A · CODE REVIEW</text>
    <text x="682" y="550">B · SECURITY SCAN</text>
    <text x="682" y="572">C · TEST COVERAGE</text>
    <text x="682" y="594">D · DOCS AUDIT</text>
  </g>

  <!-- Diagonal separator bars between columns -->
  <line x1="340" y1="300" x2="340" y2="540" stroke="#0a0a0a" stroke-width="1.5"/>
  <line x1="655" y1="300" x2="655" y2="540" stroke="#0a0a0a" stroke-width="1.5"/>

  <!-- Bottom bar -->
  <rect x="6" y="630" width="988" height="44" fill="#0a0a0a"/>
  <text x="28" y="659" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#fde047" letter-spacing="3">▸ COMPLETE · TESTED · DOCUMENTED ————— ZERO HALF-FINISHED WORK</text>
  <text x="972" y="659" text-anchor="end" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#fdf6e3" letter-spacing="2">/DEV — 2026</text>
</svg>
