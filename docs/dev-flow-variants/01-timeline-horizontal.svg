    <text x="700" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#92400e" font-weight="600">Evaluate</text>

    <circle cx="772" cy="210" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#sh)"/>
    <text x="772" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#92400e">09</text>
    <text x="772" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#92400e" font-weight="600">Verify</text>

    <circle cx="844" cy="210" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#sh)"/>
    <text x="844" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#92400e">10</text>
    <text x="844" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#92400e" font-weight="600">Test</text>

    <circle cx="916" cy="210" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#sh)"/>
    <text x="916" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#92400e">11</text>
    <text x="916" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#92400e" font-weight="600">Goals</text>
  </g>

  <!-- Quality nodes (emerald) -->
  <g>
    <!-- Review node — highlighted with ×4 badge -->
    <circle cx="988" cy="210" r="26" fill="#059669" stroke="#047857" stroke-width="2.5" filter="url(#sh)"/>
    <text x="988" y="216" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">12</text>
    <text x="988" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#047857" font-weight="700">Review ×4</text>

    <circle cx="1060" cy="210" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2.2" filter="url(#sh)"/>
    <text x="1060" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#047857">13</text>
    <text x="1060" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#047857" font-weight="600">Critic</text>

    <circle cx="1132" cy="210" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2.2" filter="url(#sh)"/>
    <text x="1132" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#047857">14</text>
    <text x="1132" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#047857" font-weight="600">Docs</text>

    <circle cx="1204" cy="210" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2.2" filter="url(#sh)"/>
    <text x="1204" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#047857">15</text>
    <text x="1204" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#047857" font-weight="600">Report</text>
  </g>

  <!-- Review branch: 4 reviewers fan from Review node (988, 236) down to pills at y=320 -->
  <path d="M 988 236 Q 988 274 850 320" stroke="#10b981" stroke-width="1.4" fill="none" opacity="0.55" stroke-dasharray="4,3"/>
  <path d="M 988 236 Q 988 274 942 320" stroke="#10b981" stroke-width="1.4" fill="none" opacity="0.55" stroke-dasharray="4,3"/>
  <path d="M 988 236 Q 988 274 1034 320" stroke="#10b981" stroke-width="1.4" fill="none" opacity="0.55" stroke-dasharray="4,3"/>
  <path d="M 988 236 Q 988 274 1126 320" stroke="#10b981" stroke-width="1.4" fill="none" opacity="0.55" stroke-dasharray="4,3"/>

  <!-- 4 reviewer pills -->
  <g font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#065f46">
    <rect x="810" y="320" width="80" height="28" rx="14" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="850" y="339" text-anchor="middle">Code</text>

    <rect x="902" y="320" width="80" height="28" rx="14" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="942" y="339" text-anchor="middle">Security</text>

    <rect x="994" y="320" width="80" height="28" rx="14" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="1034" y="339" text-anchor="middle">Tests</text>

    <rect x="1086" y="320" width="80" height="28" rx="14" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="1126" y="339" text-anchor="middle">Docs</text>
  </g>
  <text x="988" y="368" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10.5" fill="#065f46" font-style="italic">4 parallel reviewers · double-verified findings</text>

  <!-- Footer -->
  <text x="700" y="398" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#94a3b8">complete · tested · documented — zero half-finished work</text>
</svg>
