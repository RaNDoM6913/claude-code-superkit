<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-label="/dev timeline — 16 phases in a horizontal sequence with 4-reviewer fanout">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="40%" stop-color="#a5b4fc"/>
      <stop offset="43%" stop-color="#fcd34d"/>
      <stop offset="74%" stop-color="#fcd34d"/>
      <stop offset="77%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="460" rx="20" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Caption -->
  <text x="800" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="3">/DEV — 16-PHASE DEVELOPMENT ORCHESTRATOR</text>

  <!-- /dev pill at top center -->
  <rect x="680" y="56" width="240" height="60" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.8" filter="url(#sh)"/>
  <text x="800" y="82" text-anchor="middle" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="18" font-weight="700" fill="#6d28d9">/dev &lt;task&gt;</text>
  <text x="800" y="102" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10.5" fill="#7c3aed">auto-complexity · review gates · documentation</text>

  <!-- Connector from /dev pill to track (subtle) -->
  <path d="M 800 116 L 800 145" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Phase zones (soft bands behind track) -->
  <rect x="90" y="160" width="600" height="170" rx="20" fill="#eef2ff" opacity="0.65"/>
  <rect x="700" y="160" width="480" height="170" rx="20" fill="#fef3c7" opacity="0.65"/>
  <rect x="1190" y="160" width="400" height="170" rx="20" fill="#d1fae5" opacity="0.65"/>

  <!-- Phase titles above zones -->
  <text x="390" y="186" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#4338ca" letter-spacing="2.5">PLANNING · 6</text>
  <text x="940" y="186" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#92400e" letter-spacing="2.5">EXECUTION · 5</text>
  <text x="1390" y="186" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#047857" letter-spacing="2.5">QUALITY · 4</text>

  <!-- Track: thick gradient line with rainbow phase colors -->
  <rect x="135" y="266" width="1330" height="6" rx="3" fill="url(#track)"/>

  <!-- Nodes: 15 evenly spaced at x=135, 230, 325, ..., 1465 (spacing 95) -->
  <!-- Planning (01-06) — indigo -->
  <g>
    <circle cx="135" cy="269" r="26" fill="#ffffff" stroke="#6366f1" stroke-width="2.4" filter="url(#sh)"/>
    <text x="135" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#4338ca">01</text>
    <text x="135" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#312e81">Understand</text>

    <circle cx="230" cy="269" r="26" fill="#ffffff" stroke="#6366f1" stroke-width="2.4" filter="url(#sh)"/>
    <text x="230" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#4338ca">02</text>
    <text x="230" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#312e81">Architect</text>

    <circle cx="325" cy="269" r="26" fill="#ffffff" stroke="#6366f1" stroke-width="2.4" filter="url(#sh)"/>
    <text x="325" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#4338ca">03</text>
    <text x="325" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#312e81">Pseudocode</text>

    <circle cx="420" cy="269" r="26" fill="#ffffff" stroke="#6366f1" stroke-width="2.4" filter="url(#sh)"/>
    <text x="420" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#4338ca">04</text>
    <text x="420" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#312e81">Plan</text>

    <circle cx="515" cy="269" r="26" fill="#ffffff" stroke="#6366f1" stroke-width="2.4" filter="url(#sh)"/>
    <text x="515" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#4338ca">05</text>
    <text x="515" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#312e81">Contract</text>

    <circle cx="610" cy="269" r="26" fill="#ffffff" stroke="#6366f1" stroke-width="2.4" filter="url(#sh)"/>
    <text x="610" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#4338ca">06</text>
    <text x="610" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#312e81">Validate</text>
  </g>

  <!-- Execution (07-11) — amber -->
  <g>
    <circle cx="705" cy="269" r="26" fill="#ffffff" stroke="#d97706" stroke-width="2.4" filter="url(#sh)"/>
    <text x="705" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#92400e">07</text>
    <text x="705" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#78350f">Implement</text>

    <circle cx="800" cy="269" r="26" fill="#ffffff" stroke="#d97706" stroke-width="2.4" filter="url(#sh)"/>
    <text x="800" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#92400e">08</text>
    <text x="800" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#78350f">Evaluate</text>

    <circle cx="895" cy="269" r="26" fill="#ffffff" stroke="#d97706" stroke-width="2.4" filter="url(#sh)"/>
    <text x="895" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#92400e">09</text>
    <text x="895" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#78350f">Verify</text>

    <circle cx="990" cy="269" r="26" fill="#ffffff" stroke="#d97706" stroke-width="2.4" filter="url(#sh)"/>
    <text x="990" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#92400e">10</text>
    <text x="990" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#78350f">Test</text>

    <circle cx="1085" cy="269" r="26" fill="#ffffff" stroke="#d97706" stroke-width="2.4" filter="url(#sh)"/>
    <text x="1085" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#92400e">11</text>
    <text x="1085" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#78350f">Goals</text>
  </g>

  <!-- Quality (12-15) — emerald, Review highlighted -->
  <g>
    <!-- Review — bigger, darker, filled -->
    <circle cx="1180" cy="269" r="32" fill="#059669" stroke="#047857" stroke-width="2.8" filter="url(#sh)"/>
    <text x="1180" y="275" text-anchor="middle" font-family="'SF Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">12</text>
    <text x="1180" y="228" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="700" fill="#047857">Review ×4</text>

    <circle cx="1275" cy="269" r="26" fill="#ffffff" stroke="#059669" stroke-width="2.4" filter="url(#sh)"/>
    <text x="1275" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#047857">13</text>
    <text x="1275" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#064e3b">Critic</text>

    <circle cx="1370" cy="269" r="26" fill="#ffffff" stroke="#059669" stroke-width="2.4" filter="url(#sh)"/>
    <text x="1370" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#047857">14</text>
    <text x="1370" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#064e3b">Docs</text>

    <circle cx="1465" cy="269" r="26" fill="#ffffff" stroke="#059669" stroke-width="2.4" filter="url(#sh)"/>
    <text x="1465" y="274" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#047857">15</text>
    <text x="1465" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#064e3b">Report</text>
  </g>

  <!-- Review branch: fan-out to 4 reviewer pills -->
  <!-- Pills placed below Review node -->
  <g stroke="#10b981" stroke-width="1.4" fill="none" opacity="0.6" stroke-dasharray="4,3">
    <path d="M 1180 301 Q 1180 340 1020 370"/>
    <path d="M 1180 301 Q 1180 340 1125 370"/>
    <path d="M 1180 301 Q 1180 340 1235 370"/>
    <path d="M 1180 301 Q 1180 340 1340 370"/>
  </g>

  <!-- 4 reviewer pills -->
  <g font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#065f46">
    <rect x="972" y="370" width="96" height="30" rx="15" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="1020" y="389" text-anchor="middle">Code</text>

    <rect x="1077" y="370" width="96" height="30" rx="15" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="1125" y="389" text-anchor="middle">Security</text>

    <rect x="1187" y="370" width="96" height="30" rx="15" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="1235" y="389" text-anchor="middle">Tests</text>

    <rect x="1292" y="370" width="96" height="30" rx="15" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="1340" y="389" text-anchor="middle">Docs</text>
  </g>
  <text x="1180" y="418" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10.5" fill="#065f46" font-style="italic">4 parallel reviewers · double-verified findings</text>

  <!-- Footer -->
  <text x="800" y="442" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#94a3b8">complete · tested · documented — zero half-finished work</text>
</svg>
