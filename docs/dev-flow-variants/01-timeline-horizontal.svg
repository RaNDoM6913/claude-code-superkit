<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-label="/dev timeline — 15 phases with 4 parallel reviewers">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="420" rx="20" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Caption -->
  <text x="700" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="3">/DEV — 15-PHASE ORCHESTRATOR TIMELINE</text>

  <!-- Phase zones -->
  <rect x="166" y="102" width="420" height="180" rx="18" fill="#eef2ff" opacity="0.55"/>
  <rect x="598" y="102" width="350" height="180" rx="18" fill="#fef3c7" opacity="0.55"/>
  <rect x="960" y="102" width="280" height="180" rx="18" fill="#d1fae5" opacity="0.55"/>

  <!-- Phase titles -->
  <text x="376" y="128" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#4338ca" letter-spacing="1.5">PLANNING · 6</text>
  <text x="773" y="128" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#92400e" letter-spacing="1.5">EXECUTION · 5</text>
  <text x="1100" y="128" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="1.5">QUALITY · 4</text>

  <!-- Track -->
  <line x1="196" y1="210" x2="1204" y2="210" stroke="#cbd5e1" stroke-width="2.5"/>

  <!-- Task input pill (left) -->
  <rect x="40" y="190" width="120" height="40" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="100" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="13" font-weight="700" fill="#475569">TASK</text>

  <!-- Shipped output pill (right) -->
  <rect x="1240" y="190" width="120" height="40" rx="20" fill="#6d28d9" filter="url(#sh)"/>
  <text x="1300" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">SHIPPED</text>

  <!-- Connector from Task to first node -->
  <path d="M 160 210 L 196 210" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Connector from last node to Shipped -->
  <path d="M 1204 210 L 1240 210" stroke="#6d28d9" stroke-width="2"/>

  <!-- Nodes: pos 196, 268, 340, 412, 484, 556 | 628, 700, 772, 844, 916 | 988, 1060, 1132, 1204 -->
  <!-- Planning nodes (indigo) -->
  <g>
    <circle cx="196" cy="210" r="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="196" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">01</text>
    <text x="196" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#4338ca" font-weight="600">Understand</text>

    <circle cx="268" cy="210" r="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="268" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">02</text>
    <text x="268" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#4338ca" font-weight="600">Architect</text>

    <circle cx="340" cy="210" r="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="340" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">03</text>
    <text x="340" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#4338ca" font-weight="600">Pseudocode</text>

    <circle cx="412" cy="210" r="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="412" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">04</text>
    <text x="412" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#4338ca" font-weight="600">Plan</text>

    <circle cx="484" cy="210" r="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="484" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">05</text>
    <text x="484" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#4338ca" font-weight="600">Contract</text>

    <circle cx="556" cy="210" r="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2" filter="url(#sh)"/>
    <text x="556" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#4338ca">06</text>
    <text x="556" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#4338ca" font-weight="600">Validate</text>
  </g>

  <!-- Execution nodes (amber) -->
  <g>
    <circle cx="628" cy="210" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#sh)"/>
    <text x="628" y="215" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#92400e">07</text>
    <text x="628" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#92400e" font-weight="600">Implement</text>

    <circle cx="700" cy="210" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#sh)"/>
