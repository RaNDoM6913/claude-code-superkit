<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="/dev honeycomb — 15 phases as hex tiles with 4 review children">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefbf3"/><stop offset="100%" stop-color="#fdf6e3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" rx="20" fill="url(#bg)" stroke="#e7e5e4" stroke-width="1.5"/>

  <!-- Caption -->
  <text x="600" y="38" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#78716c" letter-spacing="3">/DEV — HONEYCOMB · 15 PHASES · 4 REVIEWER CELLS</text>

  <!-- /dev pill top center -->
  <rect x="480" y="64" width="240" height="56" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.8" filter="url(#sh)"/>
  <text x="600" y="88" text-anchor="middle" font-family="'SF Mono',monospace" font-size="17" font-weight="700" fill="#6d28d9">/dev &lt;task&gt;</text>
  <text x="600" y="106" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#7c3aed">15-phase orchestrator</text>

  <!-- Phase labels (left of each row) -->
  <text x="60" y="200" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#4338ca" letter-spacing="1.5">PLANNING</text>
  <text x="60" y="218" font-family="'SF Mono',monospace" font-size="10" fill="#6366f1">6 steps</text>

  <text x="60" y="330" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#92400e" letter-spacing="1.5">EXECUTION</text>
  <text x="60" y="348" font-family="'SF Mono',monospace" font-size="10" fill="#d97706">5 steps</text>

  <text x="60" y="460" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="1.5">QUALITY</text>
  <text x="60" y="478" font-family="'SF Mono',monospace" font-size="10" fill="#059669">4 + 4 steps</text>

  <!-- ROW 1 — Planning hexes (6 tiles, flat-top, s=40) -->
  <!-- Hex centers: y=210, x spaced 95 apart starting at 210 -->
  <g font-family="'SF Mono',monospace" font-size="13" font-weight="700">
    <path d="M 250 170 L 230 205 L 250 240 L 290 240 L 310 205 L 290 170 Z" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#sh)"/>
    <text x="270" y="204" text-anchor="middle" fill="#4338ca">01</text>
    <text x="270" y="222" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#4338ca">Understand</text>

    <path d="M 345 170 L 325 205 L 345 240 L 385 240 L 405 205 L 385 170 Z" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#sh)"/>
    <text x="365" y="204" text-anchor="middle" fill="#4338ca">02</text>
    <text x="365" y="222" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#4338ca">Architect</text>

    <path d="M 440 170 L 420 205 L 440 240 L 480 240 L 500 205 L 480 170 Z" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#sh)"/>
    <text x="460" y="204" text-anchor="middle" fill="#4338ca">03</text>
    <text x="460" y="222" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#4338ca">Pseudo</text>

    <path d="M 535 170 L 515 205 L 535 240 L 575 240 L 595 205 L 575 170 Z" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#sh)"/>
    <text x="555" y="204" text-anchor="middle" fill="#4338ca">04</text>
    <text x="555" y="222" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#4338ca">Plan</text>

    <path d="M 630 170 L 610 205 L 630 240 L 670 240 L 690 205 L 670 170 Z" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#sh)"/>
    <text x="650" y="204" text-anchor="middle" fill="#4338ca">05</text>
    <text x="650" y="222" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#4338ca">Contract</text>

    <path d="M 725 170 L 705 205 L 725 240 L 765 240 L 785 205 L 765 170 Z" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#sh)"/>
    <text x="745" y="204" text-anchor="middle" fill="#4338ca">06</text>
    <text x="745" y="222" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#4338ca">Validate</text>
  </g>

  <!-- ROW 2 — Execution hexes (5 tiles, offset by 47.5 to the right) -->
  <g font-family="'SF Mono',monospace" font-size="13" font-weight="700">
    <path d="M 297 300 L 277 335 L 297 370 L 337 370 L 357 335 L 337 300 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
    <text x="317" y="334" text-anchor="middle" fill="#92400e">07</text>
    <text x="317" y="352" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#92400e">Implement</text>

    <path d="M 392 300 L 372 335 L 392 370 L 432 370 L 452 335 L 432 300 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
    <text x="412" y="334" text-anchor="middle" fill="#92400e">08</text>
    <text x="412" y="352" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#92400e">Evaluate</text>

    <path d="M 487 300 L 467 335 L 487 370 L 527 370 L 547 335 L 527 300 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
    <text x="507" y="334" text-anchor="middle" fill="#92400e">09</text>
    <text x="507" y="352" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#92400e">Verify</text>

    <path d="M 582 300 L 562 335 L 582 370 L 622 370 L 642 335 L 622 300 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
    <text x="602" y="334" text-anchor="middle" fill="#92400e">10</text>
    <text x="602" y="352" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#92400e">Test</text>

    <path d="M 677 300 L 657 335 L 677 370 L 717 370 L 737 335 L 717 300 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
    <text x="697" y="334" text-anchor="middle" fill="#92400e">11</text>
    <text x="697" y="352" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#92400e">Goals</text>
  </g>

  <!-- ROW 3 — Quality hexes (4 tiles + Review has 4 children) -->
  <g font-family="'SF Mono',monospace" font-size="13" font-weight="700">
    <!-- Review hex — special, larger, filled -->
    <path d="M 250 430 L 220 482.5 L 250 535 L 310 535 L 340 482.5 L 310 430 Z" fill="#059669" stroke="#047857" stroke-width="2.5" filter="url(#sh)"/>
    <text x="280" y="482" text-anchor="middle" fill="#ffffff">12</text>
    <text x="280" y="502" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#ffffff" font-weight="700">Review ×4</text>

    <path d="M 440 430 L 420 465 L 440 500 L 480 500 L 500 465 L 480 430 Z" fill="#d1fae5" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
    <text x="460" y="464" text-anchor="middle" fill="#047857">13</text>
    <text x="460" y="482" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#047857">Critic</text>

    <path d="M 535 430 L 515 465 L 535 500 L 575 500 L 595 465 L 575 430 Z" fill="#d1fae5" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
    <text x="555" y="464" text-anchor="middle" fill="#047857">14</text>
    <text x="555" y="482" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#047857">Docs</text>

    <path d="M 630 430 L 610 465 L 630 500 L 670 500 L 690 465 L 670 430 Z" fill="#d1fae5" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
    <text x="650" y="464" text-anchor="middle" fill="#047857">15</text>
    <text x="650" y="482" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#047857">Report</text>
  </g>

  <!-- 4 Review children hexes — attached as a cluster on the right side of Review -->
  <g font-family="-apple-system,sans-serif" font-size="9" font-weight="700" fill="#065f46">
    <!-- Small hex tiles (s=28) - hexes clustered around Review -->
    <path d="M 810 430 L 796 454.2 L 810 478.5 L 838 478.5 L 852 454.2 L 838 430 Z" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6" filter="url(#sh)"/>
    <text x="824" y="458" text-anchor="middle">Code</text>

    <path d="M 880 430 L 866 454.2 L 880 478.5 L 908 478.5 L 922 454.2 L 908 430 Z" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6" filter="url(#sh)"/>
    <text x="894" y="458" text-anchor="middle">Security</text>

    <path d="M 845 479 L 831 503 L 845 527.5 L 873 527.5 L 887 503 L 873 479 Z" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6" filter="url(#sh)"/>
    <text x="859" y="507" text-anchor="middle">Tests</text>

    <path d="M 915 479 L 901 503 L 915 527.5 L 943 527.5 L 957 503 L 943 479 Z" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6" filter="url(#sh)"/>
    <text x="929" y="507" text-anchor="middle">Docs</text>
  </g>

  <!-- Connection lines from Review to 4 children cluster -->
  <g stroke="#10b981" stroke-width="1.4" fill="none" opacity="0.55" stroke-dasharray="4,3">
    <path d="M 340 482.5 L 796 454.2"/>
    <path d="M 340 482.5 L 866 454.2"/>
    <path d="M 340 482.5 L 831 503"/>
    <path d="M 340 482.5 L 901 503"/>
  </g>

  <!-- "4 parallel reviewers" note -->
  <text x="880" y="560" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10.5" fill="#065f46" font-style="italic">4 parallel reviewers · double-verified</text>

  <!-- Flow arrows between phases -->
  <g stroke="#a8a29e" stroke-width="2" fill="none" marker-end="" opacity="0.65">
    <!-- Planning row end to Execution row start (subtle curve) -->
    <path d="M 785 205 Q 830 235 830 270 Q 830 290 297 335"  stroke-dasharray="5,3"/>
    <!-- Execution row end to Quality row start -->
    <path d="M 737 335 Q 780 365 780 400 Q 780 420 250 482.5" stroke-dasharray="5,3"/>
  </g>

  <!-- Footer -->
  <text x="600" y="612" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#a8a29e">complete · tested · documented — zero half-finished work</text>
</svg>
