<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1180" viewBox="0 0 780 1180" role="img" aria-label="/dev waterfall — 15 phases cascading top to bottom with review branch">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="mainline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="40%" stop-color="#a5b4fc"/>
      <stop offset="45%" stop-color="#fcd34d"/>
      <stop offset="73%" stop-color="#fcd34d"/>
      <stop offset="78%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="780" height="1180" rx="20" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Caption -->
  <text x="390" y="38" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="3">/DEV — WATERFALL · 15 PHASES CASCADE TOP → DOWN</text>

  <!-- /dev pill at top -->
  <rect x="270" y="60" width="240" height="60" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2" filter="url(#sh)"/>
  <text x="390" y="86" text-anchor="middle" font-family="'SF Mono',monospace" font-size="17" font-weight="700" fill="#6d28d9">/dev &lt;task&gt;</text>
  <text x="390" y="106" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#7c3aed">15-phase orchestrator</text>

  <!-- Main cascade line -->
  <rect x="386" y="120" width="8" height="930" fill="url(#mainline)" opacity="0.8" rx="4"/>

  <!-- Step cards (15 phases, alternating left-right) -->
  <!-- Phase step at y = 160 + (i-1) * 58, i=1..15 -->

  <!-- 01 Understand -->
  <rect x="230" y="140" width="160" height="44" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6" filter="url(#sh)"/>
  <text x="244" y="167" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#6366f1">01</text>
  <text x="272" y="167" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#312e81">Understand</text>
  <circle cx="390" cy="162" r="6" fill="#6366f1"/>

  <!-- 02 Architect -->
  <rect x="390" y="198" width="160" height="44" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6" filter="url(#sh)"/>
  <text x="408" y="225" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#6366f1">02</text>
  <text x="436" y="225" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#312e81">Architect</text>
  <circle cx="390" cy="220" r="6" fill="#6366f1"/>

  <!-- 03 Pseudocode -->
  <rect x="230" y="256" width="160" height="44" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6" filter="url(#sh)"/>
  <text x="244" y="283" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#6366f1">03</text>
  <text x="272" y="283" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#312e81">Pseudocode</text>
  <circle cx="390" cy="278" r="6" fill="#6366f1"/>

  <!-- 04 Plan -->
  <rect x="390" y="314" width="160" height="44" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6" filter="url(#sh)"/>
  <text x="408" y="341" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#6366f1">04</text>
  <text x="436" y="341" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#312e81">Plan</text>
  <circle cx="390" cy="336" r="6" fill="#6366f1"/>

  <!-- 05 Contract -->
  <rect x="230" y="372" width="160" height="44" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6" filter="url(#sh)"/>
  <text x="244" y="399" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#6366f1">05</text>
  <text x="272" y="399" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#312e81">Contract</text>
  <circle cx="390" cy="394" r="6" fill="#6366f1"/>

  <!-- 06 Validate -->
  <rect x="390" y="430" width="160" height="44" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6" filter="url(#sh)"/>
  <text x="408" y="457" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#6366f1">06</text>
  <text x="436" y="457" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#312e81">Validate</text>
  <circle cx="390" cy="452" r="6" fill="#6366f1"/>

  <!-- Phase badge PLANNING -->
  <text x="130" y="295" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#4338ca" letter-spacing="2" transform="rotate(-90 130 295)">PLANNING · 6</text>

  <!-- 07 Implement -->
  <rect x="230" y="488" width="160" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" filter="url(#sh)"/>
  <text x="244" y="515" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#d97706">07</text>
  <text x="272" y="515" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#78350f">Implement</text>
  <circle cx="390" cy="510" r="6" fill="#d97706"/>

  <!-- 08 Evaluate -->
  <rect x="390" y="546" width="160" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" filter="url(#sh)"/>
  <text x="408" y="573" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#d97706">08</text>
  <text x="436" y="573" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#78350f">Evaluate</text>
  <circle cx="390" cy="568" r="6" fill="#d97706"/>

  <!-- 09 Verify -->
  <rect x="230" y="604" width="160" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" filter="url(#sh)"/>
  <text x="244" y="631" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#d97706">09</text>
  <text x="272" y="631" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#78350f">Verify</text>
  <circle cx="390" cy="626" r="6" fill="#d97706"/>

  <!-- 10 Test -->
  <rect x="390" y="662" width="160" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" filter="url(#sh)"/>
  <text x="408" y="689" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#d97706">10</text>
  <text x="436" y="689" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#78350f">Test</text>
  <circle cx="390" cy="684" r="6" fill="#d97706"/>

  <!-- 11 Goals -->
  <rect x="230" y="720" width="160" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" filter="url(#sh)"/>
  <text x="244" y="747" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#d97706">11</text>
  <text x="272" y="747" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#78350f">Goals</text>
  <circle cx="390" cy="742" r="6" fill="#d97706"/>

  <!-- Phase badge EXECUTION -->
  <text x="130" y="625" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#92400e" letter-spacing="2" transform="rotate(-90 130 625)">EXECUTION · 5</text>

  <!-- 12 Review ×4 — the branching point, highlighted -->
  <rect x="230" y="778" width="160" height="54" rx="10" fill="#059669" stroke="#047857" stroke-width="2.2" filter="url(#sh)"/>
  <text x="244" y="809" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">12</text>
  <text x="272" y="809" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Review ×4</text>
  <text x="272" y="823" font-family="-apple-system,sans-serif" font-size="9" fill="#d1fae5">parallel reviewers</text>
  <circle cx="390" cy="805" r="8" fill="#059669" stroke="#ffffff" stroke-width="2"/>

  <!-- 4 REVIEW BRANCH cards on the right side -->
  <g font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#064e3b">
    <rect x="590" y="740" width="160" height="36" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
    <text x="604" y="763" font-family="'SF Mono',monospace" font-size="9" font-weight="700" fill="#059669">01</text>
    <text x="624" y="763">Code review</text>

    <rect x="590" y="782" width="160" height="36" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
    <text x="604" y="805" font-family="'SF Mono',monospace" font-size="9" font-weight="700" fill="#059669">02</text>
    <text x="624" y="805">Security scan</text>

    <rect x="590" y="824" width="160" height="36" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
    <text x="604" y="847" font-family="'SF Mono',monospace" font-size="9" font-weight="700" fill="#059669">03</text>
    <text x="624" y="847">Test coverage</text>

    <rect x="590" y="866" width="160" height="36" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
    <text x="604" y="889" font-family="'SF Mono',monospace" font-size="9" font-weight="700" fill="#059669">04</text>
    <text x="624" y="889">Docs audit</text>
  </g>

  <!-- Branch lines: from Review to each reviewer -->
  <g stroke="#059669" stroke-width="1.4" fill="none" opacity="0.65" stroke-dasharray="4,3">
    <path d="M 390 805 Q 500 758 590 758"/>
    <path d="M 390 805 Q 490 800 590 800"/>
    <path d="M 390 805 Q 490 840 590 842"/>
    <path d="M 390 805 Q 500 870 590 884"/>
  </g>

  <!-- Merge arrow back to Critic -->
  <path d="M 670 902 Q 670 940 490 895" stroke="#059669" stroke-width="1.8" fill="none" stroke-dasharray="4,3" opacity="0.65"/>

  <!-- 13 Critic -->
  <rect x="390" y="852" width="160" height="44" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/>
  <text x="408" y="879" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#059669">13</text>
  <text x="436" y="879" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#064e3b">Critic</text>
  <circle cx="390" cy="874" r="6" fill="#059669"/>

  <!-- 14 Docs -->
  <rect x="230" y="910" width="160" height="44" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/>
  <text x="244" y="937" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#059669">14</text>
  <text x="272" y="937" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#064e3b">Docs</text>
  <circle cx="390" cy="932" r="6" fill="#059669"/>

  <!-- 15 Report -->
  <rect x="390" y="968" width="160" height="44" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/>
  <text x="408" y="995" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#059669">15</text>
  <text x="436" y="995" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#064e3b">Report</text>
  <circle cx="390" cy="990" r="6" fill="#059669"/>

  <!-- Phase badge QUALITY -->
  <text x="130" y="925" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="2" transform="rotate(-90 130 925)">QUALITY · 4</text>

  <!-- Final merge arrow + DONE pill -->
  <rect x="295" y="1070" width="190" height="52" rx="14" fill="#6d28d9" filter="url(#sh)"/>
  <text x="390" y="1095" text-anchor="middle" font-family="'SF Mono',monospace" font-size="15" font-weight="700" fill="#ffffff">DONE</text>
  <text x="390" y="1112" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#ddd6fe">tested · documented · shipped</text>

  <!-- Footer -->
  <text x="390" y="1150" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#94a3b8">complete · tested · documented — zero half-finished work</text>
</svg>
