<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="/dev isometric stack — 3 phase platforms with depth and 4 review pillars">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <!-- Isometric faces: front + top + side -->
    <linearGradient id="planFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="planTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/><stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="planSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="execFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="execTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="execSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="qualFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="qualTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/><stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="qualSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="20" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Caption -->
  <text x="600" y="36" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="3">/DEV — ISOMETRIC STACK · 3 PLATFORMS · 4 REVIEW PILLARS</text>

  <!-- /dev pill top-left floating above stack -->
  <rect x="80" y="70" width="220" height="56" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.8" filter="url(#sh)"/>
  <text x="190" y="94" text-anchor="middle" font-family="'SF Mono',monospace" font-size="17" font-weight="700" fill="#6d28d9">/dev &lt;task&gt;</text>
  <text x="190" y="112" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#7c3aed">15-phase orchestrator</text>

  <!-- DONE pill top-right -->
  <rect x="900" y="70" width="220" height="56" rx="14" fill="#6d28d9" filter="url(#sh)"/>
  <text x="1010" y="94" text-anchor="middle" font-family="'SF Mono',monospace" font-size="15" font-weight="700" fill="#ffffff">DONE</text>
  <text x="1010" y="112" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#ddd6fe">tested · documented · shipped</text>

  <!-- ═══════ PLANNING PLATFORM (bottom — widest) ═══════ -->
  <!-- Front face: 200-800, y=450-510 -->
  <polygon points="200,510 800,510 800,570 200,570" fill="url(#planFront)" stroke="#4338ca" stroke-width="1.5" filter="url(#sh)"/>
  <!-- Top face: parallelogram (top of platform) -->
  <polygon points="200,510 800,510 845,475 245,475" fill="url(#planTop)" stroke="#4338ca" stroke-width="1.5"/>
  <!-- Side face (right) -->
  <polygon points="800,510 845,475 845,535 800,570" fill="url(#planSide)" stroke="#4338ca" stroke-width="1.5"/>

  <!-- Planning label on front face -->
  <text x="220" y="550" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="2">PLANNING · 6</text>

  <!-- Planning steps on top face — 6 small cards (rendered as small tilted boxes) -->
  <g font-family="'SF Mono',monospace" font-size="10" font-weight="700">
    <!-- Each step: rectangle tilted with top face matching parallelogram angle -->
    <polygon points="260,494 348,494 360,482 272,482" fill="#eef2ff" stroke="#4338ca" stroke-width="1"/>
    <text x="298" y="491" text-anchor="middle" fill="#4338ca">01 Under</text>

    <polygon points="358,494 446,494 458,482 370,482" fill="#eef2ff" stroke="#4338ca" stroke-width="1"/>
    <text x="396" y="491" text-anchor="middle" fill="#4338ca">02 Arch</text>

    <polygon points="456,494 544,494 556,482 468,482" fill="#eef2ff" stroke="#4338ca" stroke-width="1"/>
    <text x="494" y="491" text-anchor="middle" fill="#4338ca">03 Pseudo</text>

    <polygon points="554,494 642,494 654,482 566,482" fill="#eef2ff" stroke="#4338ca" stroke-width="1"/>
    <text x="592" y="491" text-anchor="middle" fill="#4338ca">04 Plan</text>

    <polygon points="652,494 740,494 752,482 664,482" fill="#eef2ff" stroke="#4338ca" stroke-width="1"/>
    <text x="690" y="491" text-anchor="middle" fill="#4338ca">05 Contract</text>

    <polygon points="750,494 838,494 838,482 762,482" fill="#eef2ff" stroke="#4338ca" stroke-width="1"/>
    <text x="790" y="491" text-anchor="middle" fill="#4338ca">06 Valid</text>
  </g>

  <!-- ═══════ EXECUTION PLATFORM (middle) ═══════ -->
  <polygon points="240,350 780,350 780,410 240,410" fill="url(#execFront)" stroke="#92400e" stroke-width="1.5" filter="url(#sh)"/>
  <polygon points="240,350 780,350 825,315 285,315" fill="url(#execTop)" stroke="#92400e" stroke-width="1.5"/>
  <polygon points="780,350 825,315 825,375 780,410" fill="url(#execSide)" stroke="#92400e" stroke-width="1.5"/>

  <text x="260" y="390" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="2">EXECUTION · 5</text>

  <g font-family="'SF Mono',monospace" font-size="10" font-weight="700">
    <polygon points="300,334 404,334 416,322 312,322" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <text x="358" y="331" text-anchor="middle" fill="#92400e">07 Implement</text>

    <polygon points="414,334 514,334 526,322 426,322" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <text x="470" y="331" text-anchor="middle" fill="#92400e">08 Evaluate</text>

    <polygon points="524,334 604,334 616,322 536,322" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <text x="570" y="331" text-anchor="middle" fill="#92400e">09 Verify</text>

    <polygon points="614,334 694,334 706,322 626,322" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <text x="660" y="331" text-anchor="middle" fill="#92400e">10 Test</text>

    <polygon points="704,334 800,334 812,322 716,322" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <text x="758" y="331" text-anchor="middle" fill="#92400e">11 Goals</text>
  </g>

  <!-- ═══════ QUALITY PLATFORM (top — narrowest, with review pillars above) ═══════ -->
  <polygon points="280,230 720,230 720,290 280,290" fill="url(#qualFront)" stroke="#047857" stroke-width="1.5" filter="url(#sh)"/>
  <polygon points="280,230 720,230 765,195 325,195" fill="url(#qualTop)" stroke="#047857" stroke-width="1.5"/>
  <polygon points="720,230 765,195 765,255 720,290" fill="url(#qualSide)" stroke="#047857" stroke-width="1.5"/>

  <text x="300" y="270" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="2">QUALITY · 4</text>

  <g font-family="'SF Mono',monospace" font-size="10" font-weight="700">
    <!-- Review — highlighted darker -->
    <polygon points="340,214 460,214 472,202 352,202" fill="#059669" stroke="#047857" stroke-width="1.5"/>
    <text x="406" y="211" text-anchor="middle" fill="#ffffff">12 Review ×4</text>

    <polygon points="470,214 550,214 562,202 482,202" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
    <text x="516" y="211" text-anchor="middle" fill="#047857">13 Critic</text>

    <polygon points="560,214 630,214 642,202 572,202" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
    <text x="601" y="211" text-anchor="middle" fill="#047857">14 Docs</text>

    <polygon points="640,214 740,214 752,202 652,202" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
    <text x="696" y="211" text-anchor="middle" fill="#047857">15 Report</text>
  </g>

  <!-- 4 REVIEW PILLARS rising from top platform over Review step -->
  <g>
    <!-- Pillar 1 Code (leftmost) -->
    <polygon points="790,120 860,120 860,208 790,208" fill="#ecfdf5" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
    <polygon points="790,120 860,120 876,104 806,104" fill="#a7f3d0" stroke="#059669" stroke-width="1.8"/>
    <polygon points="860,120 876,104 876,192 860,208" fill="#6ee7b7" stroke="#059669" stroke-width="1.8"/>
    <text x="825" y="160" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#065f46">CODE</text>
    <text x="825" y="178" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="8" fill="#047857">review</text>

    <polygon points="880,120 950,120 950,208 880,208" fill="#ecfdf5" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
    <polygon points="880,120 950,120 966,104 896,104" fill="#a7f3d0" stroke="#059669" stroke-width="1.8"/>
    <polygon points="950,120 966,104 966,192 950,208" fill="#6ee7b7" stroke="#059669" stroke-width="1.8"/>
    <text x="915" y="156" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#065f46">SECURITY</text>
    <text x="915" y="174" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="8" fill="#047857">scan</text>

    <polygon points="970,120 1040,120 1040,208 970,208" fill="#ecfdf5" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
    <polygon points="970,120 1040,120 1056,104 986,104" fill="#a7f3d0" stroke="#059669" stroke-width="1.8"/>
    <polygon points="1040,120 1056,104 1056,192 1040,208" fill="#6ee7b7" stroke="#059669" stroke-width="1.8"/>
    <text x="1005" y="160" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#065f46">TESTS</text>
    <text x="1005" y="178" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="8" fill="#047857">coverage</text>

    <polygon points="1060,120 1130,120 1130,208 1060,208" fill="#ecfdf5" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
    <polygon points="1060,120 1130,120 1146,104 1076,104" fill="#a7f3d0" stroke="#059669" stroke-width="1.8"/>
    <polygon points="1130,120 1146,104 1146,192 1130,208" fill="#6ee7b7" stroke="#059669" stroke-width="1.8"/>
    <text x="1095" y="160" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#065f46">DOCS</text>
    <text x="1095" y="178" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="8" fill="#047857">audit</text>
  </g>

  <!-- "REVIEW ×4" banner above pillars -->
  <rect x="785" y="85" width="360" height="20" rx="4" fill="#047857"/>
  <text x="965" y="99" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="2">REVIEW ×4 · PARALLEL PILLARS</text>

  <!-- Dashed flow from /dev to Planning to Exec to Quality (vertical spine) -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none" opacity="0.6" stroke-dasharray="5,4">
    <path d="M 190 130 L 190 430 L 220 500"/>
    <path d="M 450 475 L 450 335 L 480 330"/>
    <path d="M 500 315 L 500 215 L 540 210"/>
    <path d="M 750 215 L 1010 130"/>
  </g>

  <!-- Depth lines separator shadow -->
  <line x1="200" y1="570" x2="845" y2="535" stroke="#4338ca" stroke-width="1" opacity="0.3"/>

  <!-- Footer -->
  <text x="600" y="690" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#64748b">complete · tested · documented — zero half-finished work</text>
</svg>
