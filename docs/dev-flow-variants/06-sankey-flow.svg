<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-label="/dev sankey flow — 15 phases as flowing bands with 4-stream review split">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="gPlan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7d2fe"/><stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="gExec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="gQual" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a7f3d0"/><stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="520" rx="20" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Caption -->
  <text x="700" y="38" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="3">/DEV — SANKEY FLOW · 15 PHASES NARROW INTO 4 REVIEW STREAMS</text>

  <!-- TASK input pill -->
  <rect x="30" y="240" width="110" height="40" rx="20" fill="#ffffff" stroke="#475569" stroke-width="1.8" filter="url(#sh)"/>
  <text x="85" y="266" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#334155">TASK</text>

  <!-- SHIPPED output pill -->
  <rect x="1260" y="240" width="110" height="40" rx="20" fill="#6d28d9" filter="url(#sh)"/>
  <text x="1315" y="266" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">SHIPPED</text>

  <!-- Planning band (widest — 6 steps) -->
  <path d="M 140 200 L 560 215 L 560 305 L 140 320 Z" fill="url(#gPlan)" stroke="#6366f1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="188" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#4338ca" letter-spacing="2">PLANNING · 6</text>

  <!-- Planning step markers: 01..06 -->
  <g font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#312e81">
    <circle cx="170" cy="260" r="13" fill="#ffffff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="170" y="264" text-anchor="middle">01</text>

    <circle cx="234" cy="260" r="13" fill="#ffffff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="234" y="264" text-anchor="middle">02</text>

    <circle cx="298" cy="260" r="13" fill="#ffffff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="298" y="264" text-anchor="middle">03</text>

    <circle cx="362" cy="260" r="13" fill="#ffffff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="362" y="264" text-anchor="middle">04</text>

    <circle cx="426" cy="260" r="13" fill="#ffffff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="426" y="264" text-anchor="middle">05</text>

    <circle cx="490" cy="260" r="13" fill="#ffffff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="490" y="264" text-anchor="middle">06</text>
  </g>
  <text x="350" y="345" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#4338ca">Understand · Architect · Pseudocode · Plan · Contract · Validate</text>

  <!-- Execution band (narrows — 5 steps) -->
  <path d="M 560 215 L 900 230 L 900 290 L 560 305 Z" fill="url(#gExec)" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="730" y="203" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#92400e" letter-spacing="2">EXECUTION · 5</text>

  <!-- Execution step markers: 07..11 -->
  <g font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#78350f">
    <circle cx="600" cy="260" r="13" fill="#ffffff" stroke="#92400e" stroke-width="1.5"/>
    <text x="600" y="264" text-anchor="middle">07</text>

    <circle cx="665" cy="260" r="13" fill="#ffffff" stroke="#92400e" stroke-width="1.5"/>
    <text x="665" y="264" text-anchor="middle">08</text>

    <circle cx="730" cy="260" r="13" fill="#ffffff" stroke="#92400e" stroke-width="1.5"/>
    <text x="730" y="264" text-anchor="middle">09</text>

    <circle cx="795" cy="260" r="13" fill="#ffffff" stroke="#92400e" stroke-width="1.5"/>
    <text x="795" y="264" text-anchor="middle">10</text>

    <circle cx="860" cy="260" r="13" fill="#ffffff" stroke="#92400e" stroke-width="1.5"/>
    <text x="860" y="264" text-anchor="middle">11</text>
  </g>
  <text x="730" y="330" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#92400e">Implement · Evaluate · Verify · Test · Goals</text>

  <!-- Quality entry (Review point — where the split happens) -->
  <path d="M 900 230 L 970 235 L 970 285 L 900 290 Z" fill="url(#gQual)" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="935" cy="260" r="17" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="935" y="265" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">12</text>

  <!-- 4 parallel review streams — 970 to 1150 -->
  <g font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#065f46">
    <!-- Transition from single band to 4 streams (fan out) -->
    <path d="M 970 235 L 1000 218 L 1000 232 L 970 240 Z" fill="#10b981"/>
    <path d="M 970 245 L 1000 245 L 1000 260 L 970 260 Z" fill="#10b981"/>
    <path d="M 970 262 L 1000 270 L 1000 285 L 970 275 Z" fill="#10b981"/>

    <!-- Stream 1 — Code -->
    <rect x="1000" y="212" width="150" height="22" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
    <text x="1075" y="227" text-anchor="middle">CODE</text>

    <!-- Stream 2 — Security -->
    <rect x="1000" y="238" width="150" height="22" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
    <text x="1075" y="253" text-anchor="middle">SECURITY</text>

    <!-- Stream 3 — Tests -->
    <rect x="1000" y="264" width="150" height="22" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
    <text x="1075" y="279" text-anchor="middle">TESTS</text>

    <!-- Stream 4 — Docs -->
    <rect x="1000" y="290" width="150" height="22" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
    <text x="1075" y="305" text-anchor="middle">DOCS</text>
  </g>

  <!-- Rejoin streams into single Quality band (1150 → 1260) -->
  <path d="M 1150 212 L 1180 230 L 1180 290 L 1150 312 L 1150 290 L 1150 286 L 1150 260 L 1150 234 Z" fill="url(#gQual)" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M 1180 230 L 1260 245 L 1260 275 L 1180 290 Z" fill="url(#gQual)" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>

  <!-- Critic/Docs/Report markers on rejoined band -->
  <g font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#064e3b">
    <circle cx="1200" cy="260" r="12" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="1200" y="264" text-anchor="middle">13</text>

    <circle cx="1230" cy="260" r="12" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="1230" y="264" text-anchor="middle">14</text>

    <circle cx="1255" cy="260" r="12" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="1255" y="264" text-anchor="middle">15</text>
  </g>

  <text x="1200" y="193" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#047857" letter-spacing="2">QUALITY · 4</text>
  <text x="1075" y="342" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#047857">Review ×4 streams · Critic · Docs · Report</text>

  <!-- "Review ×4" emphasis -->
  <rect x="975" y="170" width="200" height="28" rx="14" fill="#059669"/>
  <text x="1075" y="189" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#ffffff">REVIEW ×4 · PARALLEL STREAMS</text>

  <!-- Phase legend bar below -->
  <g font-family="-apple-system,sans-serif" font-size="11" font-weight="600">
    <rect x="160" y="420" width="24" height="24" rx="4" fill="#a5b4fc"/>
    <text x="194" y="437" fill="#4338ca">Planning · 6 analytical steps before any code</text>

    <rect x="560" y="420" width="24" height="24" rx="4" fill="#fcd34d"/>
    <text x="594" y="437" fill="#92400e">Execution · 5 steps of building + verification</text>

    <rect x="950" y="420" width="24" height="24" rx="4" fill="#6ee7b7"/>
    <text x="984" y="437" fill="#047857">Quality · 4 review streams double-verified</text>
  </g>

  <!-- Footer -->
  <text x="700" y="488" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#94a3b8">complete · tested · documented — zero half-finished work</text>
</svg>
