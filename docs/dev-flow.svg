<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="/dev — 15-phase development orchestrator. Planning (6 steps) then Execution (5 steps) then Quality (4 steps).">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="960" height="480" rx="20" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Caption -->
  <text x="480" y="36" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">15-PHASE DEVELOPMENT ORCHESTRATOR</text>

  <!-- /dev command pill -->
  <rect x="340" y="56" width="280" height="60" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="480" y="80" text-anchor="middle"
        font-family="'SF Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace"
        font-size="17" font-weight="700" fill="#6d28d9">/dev &lt;task&gt;</text>
  <text x="480" y="100" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#7c3aed">auto-complexity · review gates · documentation</text>

  <!-- ─────────────── PHASE 1: Planning (indigo) ─────────────── -->
  <rect x="50" y="144" width="260" height="240" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="70" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#4338ca">Planning</text>
  <text x="290" y="178" text-anchor="end" font-family="'SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" fill="#6366f1" opacity="0.85">6 steps</text>
  <line x1="70" y1="190" x2="290" y2="190" stroke="#c7d2fe" stroke-width="1"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#312e81">
    <text y="220"><tspan x="70" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#6366f1">01</tspan><tspan x="100">Understand</tspan></text>
    <text y="244"><tspan x="70" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#6366f1">02</tspan><tspan x="100">Architect</tspan></text>
    <text y="268"><tspan x="70" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#6366f1">03</tspan><tspan x="100">Pseudocode</tspan></text>
    <text y="292"><tspan x="70" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#6366f1">04</tspan><tspan x="100">Plan</tspan></text>
    <text y="316"><tspan x="70" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#6366f1">05</tspan><tspan x="100">Contract</tspan></text>
    <text y="340"><tspan x="70" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#6366f1">06</tspan><tspan x="100">Validate</tspan></text>
  </g>

  <!-- Arrow: Planning → Execution -->
  <path d="M 316 180 L 344 180" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- ─────────────── PHASE 2: Execution (amber) ─────────────── -->
  <rect x="350" y="144" width="260" height="240" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="370" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#92400e">Execution</text>
  <text x="590" y="178" text-anchor="end" font-family="'SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" fill="#d97706" opacity="0.85">5 steps</text>
  <line x1="370" y1="190" x2="590" y2="190" stroke="#fde68a" stroke-width="1"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#78350f">
    <text y="220"><tspan x="370" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#d97706">07</tspan><tspan x="400">Implement</tspan></text>
    <text y="244"><tspan x="370" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#d97706">08</tspan><tspan x="400">Evaluate</tspan></text>
    <text y="268"><tspan x="370" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#d97706">09</tspan><tspan x="400">Verify</tspan></text>
    <text y="292"><tspan x="370" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#d97706">10</tspan><tspan x="400">Test</tspan></text>
    <text y="316"><tspan x="370" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#d97706">11</tspan><tspan x="400">Goals</tspan></text>
  </g>

  <!-- Arrow: Execution → Quality -->
  <path d="M 616 180 L 644 180" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- ─────────────── PHASE 3: Quality (emerald) ─────────────── -->
  <rect x="650" y="144" width="260" height="240" rx="14" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="670" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#047857">Quality</text>
  <text x="890" y="178" text-anchor="end" font-family="'SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" fill="#059669" opacity="0.85">4 steps</text>
  <line x1="670" y1="190" x2="890" y2="190" stroke="#a7f3d0" stroke-width="1"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#064e3b">
    <text y="220"><tspan x="670" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#059669">12</tspan><tspan x="700">Review ×4</tspan></text>
    <text y="244"><tspan x="670" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#059669">13</tspan><tspan x="700">Critic</tspan></text>
    <text y="268"><tspan x="670" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#059669">14</tspan><tspan x="700">Docs</tspan></text>
    <text y="292"><tspan x="670" font-family="'SF Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#059669">15</tspan><tspan x="700">Report</tspan></text>
  </g>

  <!-- Bottom tagline -->
  <text x="480" y="438" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="11" fill="#94a3b8">complete · tested · documented — zero half-finished work</text>
</svg>
